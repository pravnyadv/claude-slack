name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json and plugin.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$v"
          test "$(node -p "require('./.claude-plugin/plugin.json').version")" = "$v"
      - run: npm test
      - name: Release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md && test -s notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
